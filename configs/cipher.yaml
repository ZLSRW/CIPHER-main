model:
  node_feature_dim: 64
  field_dim: 224
  token_dim: 56
  chebyshev_order: 4
  num_local_layers: 2
  num_operator_steps: 3
  num_pathway_factors: 6
  dropout: 0.10

loss:
  lambda_op: 0.08
  lambda_tr: 0.04
  lambda_bal: 0.08
  lambda_ent: 0.03
  label_smoothing: 0.02
  positive_class_weight: 1.0
  structural_ramp_epochs: 6

training:
  epochs: 70
  patience: 16
  learning_rate: 0.0007
  weight_decay: 0.0001
  gradient_clip: 2.0
  seed: 42
