[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-graph-fusion"
version = "2.0.0"
description = "Consensus-informed graph-knowledge fusion for autism-related interactions"
readme = "README.md"
requires-python = ">=3.8,<3.12"
dependencies = [
  "torch==2.3.0", "torch-geometric==2.6.1", "numpy==1.24.4",
  "pandas==2.0.3", "scipy==1.10.1", "scikit-learn==1.3.2", "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
cipher-train = "cipher.train:main"
cipher-predict = "cipher.predict:main"
cipher-check-data = "cipher.check_data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
